<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Style</title>

    <style>
        body {
            background-color: cadetblue;
        }

        div {
            width: 50%;
            margin-left: auto;
            margin-right: auto;
            border: solid black;
            border-radius: 10px;

        h1 {
            color: blue;
            text-decoration-line: underline;
            text-align: center;

        p {
            text-indent: 20px;
            font-family: Arial, Helvetica, sans-serif;
       }
